name: Jarvis Windows frontend build
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Build frontend only without private backend
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\build.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Windows-frontend-unsigned
          path: dist/Jarvis-Frontend.exe
          retention-days: 14
          if-no-files-found: error
